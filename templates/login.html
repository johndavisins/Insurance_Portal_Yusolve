<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Yusolve — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0a1628;--red:#c0392b;--red-b:#e74c3c;--gold:#d4a843;--gold-l:#f0c96e;--white:#fff;--muted:#8899bb;--border:rgba(255,255,255,0.08)}
body{font-family:'Barlow',sans-serif;background:var(--navy);color:var(--white);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 80% 60% at 20% 0%,rgba(192,57,43,0.15),transparent 60%),radial-gradient(ellipse 60% 40% at 80% 100%,rgba(41,128,185,0.08),transparent 60%),linear-gradient(160deg,#0a1628,#0d1e3a 40%,#0a1628)}
.gbg{position:fixed;inset:0;z-index:0;background-image:linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px);background-size:60px 60px}

.wrap{position:relative;z-index:1;width:100%;max-width:420px}

/* Logo */
.logo{text-align:center;margin-bottom:32px}
.lmark{width:52px;height:52px;background:var(--red);border-radius:12px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px;box-shadow:0 8px 24px rgba(192,57,43,0.35)}
.lmark svg{width:28px;height:28px;fill:#fff}
.bname{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;letter-spacing:2px;color:#fff;text-transform:uppercase;display:block;line-height:1}
.bsub{font-size:10px;color:var(--gold);letter-spacing:2.5px;text-transform:uppercase;margin-top:4px;display:block}

/* Card */
.card{background:rgba(15,32,68,0.8);border:1px solid var(--border);border-radius:16px;padding:36px;backdrop-filter:blur(20px)}
.card-title{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
.card-sub{font-size:13px;color:var(--muted);margin-bottom:28px}

.flash{padding:11px 14px;border-radius:8px;margin-bottom:18px;font-size:13px;font-weight:500}
.flash.error{background:rgba(192,57,43,0.18);border:1px solid rgba(192,57,43,0.35);color:#ff7c72}
.flash.success{background:rgba(39,174,96,0.18);border:1px solid rgba(39,174,96,0.35);color:#7ee787}

.fg{margin-bottom:18px}
.fg label{display:block;font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.fg input{width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:8px;padding:11px 14px;color:#fff;font-family:'Barlow',sans-serif;font-size:14px;outline:none;transition:all .2s}
.fg input:focus{border-color:rgba(192,57,43,0.6);background:rgba(255,255,255,0.07)}
.fg input::placeholder{color:rgba(255,255,255,0.2)}

.btn-primary{width:100%;background:var(--red);border:none;border-radius:8px;padding:13px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:background .2s;margin-top:6px}
.btn-primary:hover{background:var(--red-b)}

.divider{display:flex;align-items:center;gap:12px;margin:22px 0}
.divider span{color:var(--muted);font-size:11px;white-space:nowrap;letter-spacing:.5px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}

.btn-google{width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:8px;padding:12px;color:#fff;font-family:'Barlow',sans-serif;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;transition:all .2s}
.btn-google:hover{background:rgba(255,255,255,0.09);border-color:rgba(255,255,255,0.15)}
.btn-google svg{width:18px;height:18px;flex-shrink:0}

.auth-foot{text-align:center;margin-top:20px;font-size:13px;color:var(--muted)}
.auth-foot a{color:var(--gold-l);text-decoration:none;font-weight:500}
.auth-foot a:hover{text-decoration:underline}

@media(max-width:480px){.card{padding:24px}.wrap{max-width:100%}}
</style>
</head>
<body>
<div class="bg"></div><div class="gbg"></div>
<div class="wrap">
  <div class="logo">
    <div class="lmark"><svg viewBox="0 0 24 24"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zm-.5 1.5 1.96 2.5H17V9.5h2.5zM6 18c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm13.5-1c0 .55-.45 1-1 1s-1-.45-1-1 .45-1 1-1 1 .45 1 1z"/></svg></div>
    <span class="bname">Yusolve</span>
    <span class="bsub">Insurance Operations</span>
  </div>
  <div class="card">
    <h1 class="card-title">Welcome back</h1>
    <p class="card-sub">Sign in to your account to continue</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
    {% endwith %}
    <form method="POST" action="/login">
      <div class="fg"><label>Email address</label><input type="email" name="email" placeholder="you@yusolve.com" required autocomplete="email"/></div>
      <div class="fg"><label>Password</label><input type="password" name="password" placeholder="••••••••" required autocomplete="current-password"/></div>
      <button type="submit" class="btn-primary">Sign in</button>
    </form>
    <div class="divider"><span>or</span></div>
    <a href="/login/google" class="btn-google">
      <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
      Continue with Google
    </a>
    <p class="auth-foot">Don't have an account? <a href="/register">Create one</a></p>
  </div>
</div>
</body>
</html>
